[project]
name = "fantasy-football"
version = "0.1.0"
description = "Personal read-only analytics for one private Yahoo fantasy football league, layered on free public NFL data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Yahoo Fantasy Sports API (read-only usage; see src/yahoo/client.py)
    "yahoo-fantasy-api>=2.12",
    "yahoo-oauth>=2.0",
    # nflverse data access. nfl_data_py is deprecated/archived (Sep 2025);
    # nflreadpy is the successor and returns Polars DataFrames.
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    # HTTP for Sleeper and any direct nflverse-data release downloads
    "httpx>=0.27",
    # RotoWire injury RSS
    "feedparser>=6.0",
    # .env loading for local config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
